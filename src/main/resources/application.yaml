server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: DocumentManagement
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: false
  sql:
    init:
      mode: always
      continue-on-error: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  # Required for AWS S3 (e.g. "ap-southeast-1"), optional for MinIO
  region: ${MINIO_REGION:}
  # Optional: pre-signed URL expiry in minutes
  presigned-expiry-minutes: ${MINIO_PRESIGNED_EXPIRY_MINUTES:60}
  # Optional: public URL prefix used when generating presigned URLs (e.g. behind a reverse proxy).
  # Leave empty to use MINIO_ENDPOINT directly.
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
