    port: 25
    username: test
    password: test
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-test-secret-12
    expiration-ms: 86400000


