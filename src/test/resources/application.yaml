spring:
  application:
    name: DocumentManagement
  datasource:
    url: jdbc:h2:mem:dmtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
